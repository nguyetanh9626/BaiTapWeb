# Cấu hình kết nối SQL Server cho project baitapweb
# Đồng bộ với tài khoản SQL Server trong persistence.xml (sa / 1234567@a$)
# Có thể chỉnh trực tiếp tại đây hoặc override bằng biến môi trường:
# BAITAPWEB_DB_URL, BAITAPWEB_DB_USER, BAITAPWEB_DB_PASSWORD
db.server=localhost
db.port=1433
db.database=baitapweb
db.integratedSecurity=false
db.user=sa
db.password=1234567@a$

# Thư mục lưu ảnh upload danh mục (để trống sẽ tự lưu tại ${user.home}/baitapweb-uploads)
# Có thể ghi đè bằng biến môi trường BAITAPWEB_UPLOAD_DIR
app.upload.dir=

# ============================================================
# Cấu hình gửi Email thực tế qua Gmail SMTP (hoặc Outlook/Yahoo/Mailtrap)
# Hướng dẫn:
# 1. Bật xác minh 2 bước trong tài khoản Google.
# 2. Truy cập: https://myaccount.google.com/apppasswords
# 3. Tạo một "Mật khẩu ứng dụng" (App Password) gồm 16 chữ cái.
# 4. Điền email và mật khẩu ứng dụng đó vào 2 dòng dưới đây:
# ============================================================
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=
mail.smtp.password=

# Cấu hình Cloudinary (hoặc thiết lập biến môi trường CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET)
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
